<!DOCTYPE html>

<meta charset="utf-8"/>

<title>Onboarding Complete - Nexus Enterprise</title>

                "primary": "#0f172a",

                "primary-fixed-dim": "#334155",
                "on-surface-variant": "#64748b",
                "outline-variant": "#e2e8f0"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",

                    "xl": "0.75rem",

<style>
        body { font-family: 'Public Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex antialiased">
<!-- SideNavBar -->
<nav class="w-[240px] h-screen fixed left-0 top-0 border-r border-outline-variant bg-surface-container-low dark:bg-surface-container-low flex flex-col h-full py-lg px-md gap-xl z-20">
<!-- Header -->
<div class="flex items-center gap-3 px-3">
<div class="w-8 h-8 rounded bg-slate-900 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-white text-sm" style="font-variation-settings: 'FILL' 1;">dataset</span>
</div>
<div>
<h1 class="font-headline-md text-headline-md font-bold tracking-tighter text-primary-fixed leading-tight">NEXUS</h1>
<p class="text-xs text-slate-500">Enterprise Setup</p>
</div>
</div>
<!-- Navigation Links -->
<div class="flex flex-col gap-2 mt-4 flex-1 font-body-md text-body-md">
<!-- Step 1: Connection (Completed/Inactive) -->
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant font-medium hover:bg-slate-100 transition-colors duration-200" href="#">
<span class="material-symbols-outlined text-emerald-500">check</span>
<span>Connection</span>
</a>
<!-- Step 2: Scanning (Completed/Inactive) -->
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant font-medium hover:bg-slate-100 transition-colors duration-200" href="#">
<span class="material-symbols-outlined text-emerald-500">check</span>
<span>Scanning</span>
</a>
<!-- Step 3: Completion (Active) -->
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-primary font-bold border-r-2 border-primary bg-slate-200/50 opacity-80 scale-[0.99] transition-all" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span>Completion</span>
</a>
</div>
</nav>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col ml-[240px] min-h-screen w-[calc(100%-240px)] relative">
<!-- TopAppBar -->
<header class="docked full-width top-0 border-b border-outline-variant bg-surface dark:bg-surface flex justify-between items-center h-16 px-lg z-10 sticky">
<div class="font-headline-md text-headline-md font-bold text-primary-fixed">
                Nexus Enterprise
            </div>
<div class="flex items-center gap-4 text-on-surface-variant font-label-md text-label-md">
<button class="hover:text-primary-fixed-dim transition-colors p-2 rounded-full hover:bg-slate-100 flex items-center justify-center">
<span class="material-symbols-outlined">settings</span>
</button>
<button class="hover:text-primary-fixed-dim transition-colors p-2 rounded-full hover:bg-slate-100 flex items-center justify-center">
<span class="material-symbols-outlined">help_outline</span>
</button>
<div class="w-8 h-8 rounded-full bg-slate-200 overflow-hidden border border-slate-300 ml-2">

</div>
</div>
</header>
<!-- Main Canvas (Centered Card) -->
<main class="flex-1 flex items-center justify-center p-6 relative">
<!-- Background atmospheric effect -->
<div class="absolute inset-0 pointer-events-none bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-cyan-50/50 via-transparent to-transparent"></div>
<!-- Success Card -->
<div class="bg-white/80 backdrop-blur-md rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 p-12 max-w-xl w-full text-center relative z-10 animate-fade-in-up">
<!-- Glowing Icon -->
<div class="mb-8 relative inline-block">
<div class="absolute inset-0 bg-cyan-400 rounded-full blur-xl opacity-30 animate-pulse"></div>
<span class="material-symbols-outlined text-7xl text-cyan-500 relative z-10 drop-shadow-sm" style="font-variation-settings: 'FILL' 1;">
                        check_circle
                    </span>
</div>
<!-- Typography -->
<h2 class="text-3xl font-extrabold text-slate-900 tracking-tight mb-4 font-headline">Ready to Launch</h2>
<p class="text-slate-500 text-lg leading-relaxed mb-10 max-w-md mx-auto">
                    Scanning complete. Your infrastructure is mapped, secured, and ready for centralized management.
                </p>
<!-- Actions -->
<div class="flex flex-col sm:flex-row gap-4 justify-center items-center mb-8">
<button class="w-full sm:w-auto bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 px-8 rounded-lg shadow-sm transition-all active:scale-95 flex items-center justify-center gap-2">
<span>Enter Dashboard</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<button class="w-full sm:w-auto bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-semibold py-3 px-8 rounded-lg transition-all active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm">download</span>
<span>Download Report</span>
</button>
</div>
<!-- Footer Note -->
<div class="pt-6 border-t border-slate-100 flex items-center justify-center gap-2 text-slate-400 text-sm font-medium">
<span class="material-symbols-outlined text-[16px]">lock</span>
<span>Session encrypted end-to-end. Connection secured.</span>
</div>
</div>
</main>
</div>
<!-- Simple animations -->
<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
