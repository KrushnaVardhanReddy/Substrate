</div>
<div class="space-y-1">

<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">folder_open</span>
<span class="text-primary font-body-md text-body-md font-medium">Open Project</span>
</div>
<div class="flex items-center gap-1">
<kbd class="px-2 py-1 bg-surface-container-high rounded text-on-surface-variant font-code text-[11px] shadow-sm border border-outline-variant/30 group-hover:border-primary/30 group-hover:text-primary transition-colors">⌘</kbd>
<kbd class="px-2 py-1 bg-surface-container-high rounded text-on-surface-variant font-code text-[11px] shadow-sm border border-outline-variant/30 group-hover:border-primary/30 group-hover:text-primary transition-colors">O</kbd>
