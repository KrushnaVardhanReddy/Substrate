<div class="bg-surface-container border border-outline-variant rounded-lg p-stack-sm flex items-center justify-between w-64 shadow-sm hover:border-outline transition-colors cursor-pointer group">
<div class="flex items-center gap-stack-sm">
<!-- Health Indicator -->
<div class="relative flex h-3 w-3 items-center justify-center">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
</div>
<!-- Service Name -->

</div>
<!-- Language Badge -->
<span class="font-label-md text-label-md bg-secondary-container/30 text-secondary border border-outline-variant/50 rounded px-2 py-0.5 uppercase tracking-wider">

        </span>
