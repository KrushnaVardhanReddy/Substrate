openapi: 3.0.3
info:
  title: Substrate API
  description: The internal API for the Substrate dependency intelligence platform.
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health Check
      responses:
        '200':
          description: OK
  /api/v1/graph/{org}:
    get:
      summary: Get Dependency Graph
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of dependency edges
  /api/v1/webhook:
    post:
      summary: GitHub Push Webhook
      responses:
        '200':
          description: Webhook processed
  /api/v1/diff:
    post:
      summary: Save Diff Report
      responses:
        '201':
          description: Diff report saved
  /api/v1/ai/analyze:
    post:
      summary: Analyze Schema with AI
      responses:
        '200':
          description: Analysis stream
  /api/v1/ai/autofix:
    post:
      summary: Generate Auto-Fix with AI
      responses:
        '200':
          description: Auto-fix diff
  /api/v1/impact/{org}/{repo}:
    get:
      summary: Get Blast Radius Impact
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Impact analysis including can_deploy and can_rollback flags
  /api/v1/telemetry/track:
    post:
      summary: Track Telemetry Event
      responses:
        '200':
          description: Event tracked successfully
  /api/badges/{org}/{repo}:
    get:
      summary: Get Repository Badge
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SVG Badge
  /api/governance/generate-cel:
    post:
      summary: Generate CEL from Natural Language
      responses:
        '200':
          description: Generated CEL rule
  /api/v1/org/{org}/insurance/policy:
    get:
      summary: Get Insurance Policy
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Insurance policy details
  /api/v1/org/{org}/insurance/claims:
    get:
      summary: Get Insurance Claims
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of claims
    post:
      summary: File an Insurance Claim
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Claim created successfully
  /api/marketplace/plugins:
    get:
      summary: List Marketplace Plugins
      responses:
        '200':
          description: List of plugins
  /api/v1/public/profile/{org}:
    get:
      summary: Get Public Org Profile
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public profile details
  /api/v1/sandbox/request:
    post:
      summary: Proxy request for API Sandbox
      responses:
        '200':
          description: OK
  /api/v1/scoring/{org}:
    get:
      summary: Get API Maturity Scorecards
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scorecards details
  /api/v1/events:
    post:
      summary: Ingest Ecosystem Event
      responses:
        '201':
          description: Event ingested
  /api/v1/events/{org}:
    get:
      summary: Get Ecosystem Events Timeline
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event timeline
  /api/v1/schema/prune:
    post:
      summary: Context-Aware Schema Pruning
      responses:
        '200':
          description: Pruned schema
