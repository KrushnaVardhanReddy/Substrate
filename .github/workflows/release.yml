name: Release — Build & Push Docker Image to Docker Hub

# Triggers on every version tag push (e.g. v0.1.0, v0.2.0)
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  docker:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Pushes two tags: the exact version (v0.2.0) and 'latest'
          tags: |
            kpakkiragari/substrate-engine:${{ steps.meta.outputs.version }}
            kpakkiragari/substrate-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update action.yml to pin new version
        run: |
          sed -i "s|docker://kpakkiragari/substrate-engine:.*|docker://kpakkiragari/substrate-engine:${{ steps.meta.outputs.version }}\"|" action.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add action.yml
          git diff --staged --quiet || git commit -m "chore: pin action.yml to ${{ steps.meta.outputs.version }}"
          git push origin HEAD:main
