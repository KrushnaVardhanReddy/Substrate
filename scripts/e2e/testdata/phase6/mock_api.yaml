openapi: 3.0.0
info:
  title: Mock API
  version: 1.0.0
paths:
  /users:
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  maxLength: 50
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: User created
        '400':
          description: Invalid request
