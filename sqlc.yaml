version: "2"
sql:
  - engine: "postgresql"
    queries: "api/internal/db/queries"
    schema: "api/migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "api/internal/db/sqlcgen"
        sql_package: "pgx/v5"
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "text"
            go_type: "string"
          - db_type: "varchar"
            go_type: "string"
