syntax = "proto3";
package substrate.test.v1;
option go_package = "github.com/KrushnaVardhanReddy/Substrate/engine/internal/diff/testdata/proto;testpb";

message User {
  string id = 1;
}

message GetUserRequest {
  string id = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

service UserService {
  rpc GetUser(GetUserRequest) returns (User);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}
