asyncapi: "2.6.0"
info:
  title: User Events
  version: "1.0.0"
servers:
  production:
    url: kafka://broker:9092
    protocol: kafka
channels:
  user/signedup:
    subscribe:
      message:
        payload:
          type: object
          required: [id, email]
          properties:
            id: { type: string }
            email: { type: string }
